name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
        env:
          TURSO_DATABASE_URL: file:local.db
          ELEVENLABS_MOCK: "1"
          SITE_URL: https://example.netlify.app
      - run: node scripts/check-secrets.mjs
